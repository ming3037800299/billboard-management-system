name: jqgg

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0.41
    container_name: jqgg-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: jqgg_glm53
      MYSQL_USER: ${DB_USERNAME:-jqgg_glm53_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=100
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./mysql/02-secure-local-user.sh:/docker-entrypoint-initdb.d/02-secure-local-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  rag:
    build:
      context: ../rag-service
      dockerfile: Dockerfile
    image: jqgg-rag:1.0.0
    container_name: jqgg-rag
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      EMBEDDING_HOST: 0.0.0.0
      EMBEDDING_PORT: "11434"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-small-zh-v1.5}
      EMBEDDING_MAX_LENGTH: "${EMBEDDING_MAX_LENGTH:-512}"
    volumes:
      - ../rag-service/${RAG_MODEL_DIR:-model-small}:/app/model:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    stop_grace_period: 30s
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jqgg-app:1.0.0
    container_name: jqgg-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rag:
        condition: service_healthy
    ports:
      - "${BIND_IP:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/jqgg_glm53?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: ${DB_USERNAME:-jqgg_glm53_user}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAP_AK: ${MAP_AK:-}
      OLLAMA_BASE_URL: http://rag:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-small-zh-v1.5}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.5}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      API_SEED_DEFAULTS: ${API_SEED_DEFAULTS:-true}
      UPLOAD_DIR: /data/uploads
      CONTRACT_DIR: /data/contracts
      SERVER_PORT: "8080"
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx384m -XX:+UseG1GC -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
    volumes:
      - uploads:/data/uploads
      - contracts:/data/contracts
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/site-config HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

volumes:
  mysql_data:
    name: jqgg_mysql_data
  uploads:
    name: jqgg_uploads
  contracts:
    name: jqgg_contracts
