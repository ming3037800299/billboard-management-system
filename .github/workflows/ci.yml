name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Java 25 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and test
        run: mvn -B -DskipTests=false test

  frontend-pc:
    name: Frontend PC (Vue 3 / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-pc/package-lock.json
      - run: npm ci --prefix frontend-pc
      - run: npm run build --prefix frontend-pc

  frontend-mobile:
    name: Frontend Mobile (Vue 3 / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json
      - run: npm ci --prefix frontend-mobile
      - run: npm run build --prefix frontend-mobile
